slug: quant-finance-cqf
title: Quant Finance — CQF Core
icon: "📈"
accent: "#a78bfa"
order: 3
description: >
  From absolute zero to Black-Scholes and beyond — one step at a time. Starts with
  what a market even is; ends with the CQF syllabus: stochastic calculus, option
  pricing, volatility, portfolio theory, rates, credit, and ML in finance.
