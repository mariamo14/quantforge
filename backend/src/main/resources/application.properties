spring.application.name=quantforge

# H2 file database — zero infra, survives restarts
spring.datasource.url=jdbc:h2:file:./data/quantforge
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# JWT (local dev secret; override QUANTFORGE_JWT_SECRET in any real deployment)
quantforge.jwt.secret=${QUANTFORGE_JWT_SECRET:qf-local-dev-secret-key-change-me-0123456789abcdef}
quantforge.jwt.ttl-hours=720

# Content seeding
quantforge.content.dir=${QUANTFORGE_CONTENT_DIR:../content}
quantforge.content.enabled=true

# Judge
quantforge.judge.compiler=clang++
quantforge.judge.compile-timeout-ms=10000
quantforge.judge.max-output-bytes=262144
quantforge.judge.max-concurrent=2
